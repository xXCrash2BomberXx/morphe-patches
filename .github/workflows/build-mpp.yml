# Build-only workflow: compiles the patches and uploads the .mpp as a downloadable artifact.
# This is NOT a release workflow. Use the repo's own release.yml (semantic-release) for releases.
#
# Task name and output path come from the Morphe patches template docs:
#   ./gradlew buildAndroid  ->  patches/build/libs/patches-*.mpp
name: Build patches (.mpp)

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Match java-version to the repo's own release.yml if it differs.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build .mpp
        env:
          # The Morphe patcher library is pulled from GitHub Packages, which needs a token.
          # The default GITHUB_TOKEN may be enough; if the build fails resolving dependencies,
          # create a classic PAT with read:packages and save it as a repo secret named GH_PAT.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew buildAndroid --stacktrace

      - name: Upload .mpp
        uses: actions/upload-artifact@v4
        with:
          name: patches-mpp
          path: patches/build/libs/patches-*.mpp
          if-no-files-found: error
